<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>水道配管 AR</title>

  <!-- model-viewer (iOS AR Quick Look bridge) -->
  <script async src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>

  <!-- Three.js v0.160.0 via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    }

    /* ── カメラ映像背景 ── */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Three.js プレビューキャンバス ── */
    #preview {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* ── model-viewer (AR起動用・非表示) ── */
    model-viewer {
      position: fixed;
      bottom: 0; right: 0;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* ── コントロールパネル ── */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      background: rgba(8, 10, 22, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      color: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-end;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      color: #6688AA;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      -webkit-appearance: none;
      appearance: none;
    }

    .field input:focus {
      outline: none;
      border-color: #007AFF;
      background: rgba(0, 122, 255, 0.1);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s;
    }

    button:active { opacity: 0.7; }

    #updateBtn {
      background: rgba(255, 255, 255, 0.13);
      color: #fff;
      flex: 0.65;
    }

    #arBtn {
      background: #007AFF;
      color: #fff;
      flex: 1.35;
    }

    #arBtn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.25);
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #556688;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <!-- デバイスカメラ映像 -->
  <video id="camera" autoplay playsinline muted></video>

  <!-- Three.js 3D プレビュー -->
  <canvas id="preview"></canvas>

  <!-- AR Quick Look 用 model-viewer（非表示） -->
  <model-viewer
    id="modelViewer"
    ar
    ar-modes="quick-look"
    ar-scale="fixed"
    camera-controls>
  </model-viewer>

  <!-- UI パネル -->
  <div id="controls">
    <div class="row">
      <div class="field">
        <label>外径 (mm)</label>
        <input type="number" id="outerDia" value="100" min="10" max="500" step="5" inputmode="decimal">
      </div>
      <div class="field">
        <label>長さ (mm)</label>
        <input type="number" id="pipeLen" value="1000" min="100" max="5000" step="50" inputmode="decimal">
      </div>
    </div>
    <div class="btn-row">
      <button id="updateBtn">更新</button>
      <button id="arBtn" disabled>AR で実寸配置</button>
    </div>
    <div id="status">起動中...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter }  from 'three/addons/exporters/GLTFExporter.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ════════════════════════════════════════════
       Service Worker 登録 & GLB 転送
    ════════════════════════════════════════════ */
    let swReady = false;

    async function registerSW() {
      if (!('serviceWorker' in navigator)) return false;
      try {
        await navigator.serviceWorker.register('./sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          await new Promise(resolve => {
            navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
            setTimeout(resolve, 3000);
          });
        }
        return !!navigator.serviceWorker.controller;
      } catch (e) {
        console.error('SW registration failed:', e);
        return false;
      }
    }

    function sendGLBtoSW(buffer) {
      return new Promise((resolve, reject) => {
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = e => (e.data.ok ? resolve() : reject(new Error('SW store failed')));
        navigator.serviceWorker.controller.postMessage(
          { type: 'STORE_GLB', buffer },
          [port2, buffer]
        );
      });
    }

    /* ════════════════════════════════════════════
       配管ジオメトリ生成
       scale = 1  → mm 座標（プレビュー用）
       scale = 0.001 → m 座標（AR GLB 用）
    ════════════════════════════════════════════ */
    function buildPipeGroup(outerDiaMm, lengthMm, scale = 1) {
      const outerR  = (outerDiaMm / 2) * scale;
      const wallMm  = Math.max(2, outerDiaMm * 0.08);   // 最低 2mm 肉厚
      const innerR  = Math.max(scale * 0.5, (outerDiaMm / 2 - wallMm) * scale);
      const len     = lengthMm * scale;

      const group = new THREE.Group();

      // 外面：グレー（FrontSide）
      const outerGeo = new THREE.CylinderGeometry(outerR, outerR, len, 48, 1, true);
      const outerMat = new THREE.MeshStandardMaterial({
        color: 0x8A8A8A, roughness: 0.55, metalness: 0.15,
        side: THREE.FrontSide,
      });
      group.add(new THREE.Mesh(outerGeo, outerMat));

      // 内面：水色（DoubleSide で内外どちらからも見える）
      const innerGeo = new THREE.CylinderGeometry(innerR, innerR, len, 48, 1, true);
      const innerMat = new THREE.MeshStandardMaterial({
        color: 0x87CEEB, roughness: 0.25, metalness: 0.0,
        side: THREE.DoubleSide,
      });
      group.add(new THREE.Mesh(innerGeo, innerMat));

      // 端面：環状リング（DoubleSide）
      const capMat = new THREE.MeshStandardMaterial({
        color: 0x8A8A8A, roughness: 0.55, metalness: 0.15,
        side: THREE.DoubleSide,
      });
      for (const sign of [-1, 1]) {
        const capGeo = new THREE.RingGeometry(innerR, outerR, 48);
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.rotation.x = Math.PI / 2;
        cap.position.y = sign * len / 2;
        group.add(cap);
      }

      return group;
    }

    /* ════════════════════════════════════════════
       Three.js プレビュー
    ════════════════════════════════════════════ */
    const canvas   = document.getElementById('preview');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene  = new THREE.Scene();
    const camObj = new THREE.PerspectiveCamera(55, 1, 0.1, 100000);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(2, 5, 3);
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0xAADDFF, 0.4);
    rim.position.set(-3, 1, -2);
    scene.add(rim);

    const orbit = new OrbitControls(camObj, canvas);
    orbit.enableDamping  = true;
    orbit.dampingFactor  = 0.07;
    orbit.minDistance    = 10;
    orbit.maxDistance    = 20000;

    let previewMesh = null;

    function updatePreview() {
      const outerDia = Math.max(10,  parseFloat(document.getElementById('outerDia').value) || 100);
      const length   = Math.max(100, parseFloat(document.getElementById('pipeLen').value)  || 1000);

      // 古いメッシュ破棄
      if (previewMesh) {
        scene.remove(previewMesh);
        previewMesh.traverse(obj => {
          obj.geometry?.dispose();
          if (obj.material) {
            (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose());
          }
        });
      }

      // プレビュー用 mm スケール（水平配置）
      previewMesh = buildPipeGroup(outerDia, length, 1);
      previewMesh.rotation.z = Math.PI / 2;
      scene.add(previewMesh);

      // カメラ位置を配管サイズに合わせる
      const maxDim = Math.max(outerDia, length);
      camObj.position.set(0, maxDim * 0.45, maxDim * 1.5);
      camObj.lookAt(0, 0, 0);
      orbit.target.set(0, 0, 0);
      orbit.update();
    }

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camObj.aspect = w / h;
      camObj.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();

    (function loop() {
      requestAnimationFrame(loop);
      orbit.update();
      renderer.render(scene, camObj);
    })();

    /* ════════════════════════════════════════════
       デバイスカメラ（背景映像）
    ════════════════════════════════════════════ */
    async function startCamera() {
      const video = document.getElementById('camera');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
        });
        video.srcObject = stream;
      } catch (e) {
        console.warn('Camera unavailable:', e.message);
        video.style.background = 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)';
      }
    }

    /* ════════════════════════════════════════════
       AR GLB エクスポート → SW キャッシュ → AR 起動
    ════════════════════════════════════════════ */
    const modelViewer = document.getElementById('modelViewer');

    async function launchAR() {
      const btn      = document.getElementById('arBtn');
      const statusEl = document.getElementById('status');
      btn.disabled   = true;

      try {
        const outerDia = Math.max(10,  parseFloat(document.getElementById('outerDia').value) || 100);
        const length   = Math.max(100, parseFloat(document.getElementById('pipeLen').value)  || 1000);

        statusEl.textContent = 'GLB 生成中...';

        // AR 用シーン（メートル単位）
        const arScene = new THREE.Scene();
        const arPipe  = buildPipeGroup(outerDia, length, 0.001);
        arPipe.rotation.z = Math.PI / 2;
        arPipe.position.y = (outerDia / 2) * 0.001; // 床面（y=0）に接地
        arScene.add(arPipe);

        // GLB バイナリエクスポート
        const exporter = new GLTFExporter();
        const buffer   = await new Promise((resolve, reject) =>
          exporter.parse(arScene, resolve, reject, { binary: true })
        );

        // ArrayBuffer として正規化
        const ab = buffer instanceof ArrayBuffer ? buffer : new Uint8Array(buffer).buffer;

        if (swReady && navigator.serviceWorker.controller) {
          statusEl.textContent = 'SW へ転送中...';
          await sendGLBtoSW(ab.slice(0));

          statusEl.textContent = 'モデル読込中...';
          // src を一旦クリアして再セット（キャッシュバスター付き）
          modelViewer.src = '';
          await new Promise(r => setTimeout(r, 60));
          modelViewer.src = `pipe.glb?t=${Date.now()}`;

          await new Promise((resolve, reject) => {
            const tid = setTimeout(() => reject(new Error('モデル読込タイムアウト')), 9000);
            modelViewer.addEventListener('load',  () => { clearTimeout(tid); resolve(); }, { once: true });
            modelViewer.addEventListener('error', e  => { clearTimeout(tid); reject(e);  }, { once: true });
          });

          statusEl.textContent = 'AR 起動中...';
          modelViewer.activateAR();
          statusEl.textContent = 'AR Quick Look を起動しました ✓';

        } else {
          // SW 未登録時のフォールバック（Blob URL）
          statusEl.textContent = 'フォールバック: Blob URL AR...';
          const blob = new Blob([ab], { type: 'model/gltf-binary' });
          const url  = URL.createObjectURL(blob);

          const a   = document.createElement('a');
          a.rel     = 'ar';
          a.href    = url;
          const img = document.createElement('img');
          // 透明 1px PNG（iOS AR Quick Look 起動に <img> 子が必要）
          img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQAABjE+ibYAAAAASUVORK5CYII=';
          a.appendChild(img);
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
          statusEl.textContent = 'AR Quick Look へ転送しました ✓';
        }

      } catch (e) {
        document.getElementById('status').textContent = 'エラー: ' + e.message;
        console.error(e);
      } finally {
        btn.disabled = false;
      }
    }

    /* ════════════════════════════════════════════
       イベントバインドと初期化
    ════════════════════════════════════════════ */
    let debounceId = null;
    const debounceUpdate = () => {
      clearTimeout(debounceId);
      debounceId = setTimeout(updatePreview, 350);
    };

    document.getElementById('outerDia').addEventListener('input', debounceUpdate);
    document.getElementById('pipeLen').addEventListener('input',  debounceUpdate);
    document.getElementById('updateBtn').addEventListener('click', updatePreview);
    document.getElementById('arBtn').addEventListener('click', launchAR);

    // コントロールパネルのタッチが OrbitControls に伝播しないよう止める
    const panel = document.getElementById('controls');
    panel.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
    panel.addEventListener('mousedown',  e => e.stopPropagation());

    // 起動シーケンス
    (async () => {
      const statusEl = document.getElementById('status');
      swReady = await registerSW();
      await startCamera();
      updatePreview();
      document.getElementById('arBtn').disabled = false;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (!swReady) {
        statusEl.textContent = 'Service Worker 未登録 — ページを再読込してください';
      } else if (isIOS) {
        statusEl.textContent = 'iOS AR 対応 ✓ — 「AR で実寸配置」を押してください';
      } else {
        statusEl.textContent = 'プレビュー表示中（AR は iOS Safari のみ対応）';
      }
    })();
  </script>
</body>
</html>
