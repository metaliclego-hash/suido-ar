<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水道配管 AR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }

    #video {
      position:fixed; inset:0;
      width:100%; height:100%;
      object-fit:cover; z-index:0;
    }
    #canvas {
      position:fixed; inset:0;
      width:100%; height:100%;
      z-index:1; pointer-events:none;
    }
    #touch-layer {
      position:fixed; inset:0; z-index:10;
      touch-action:none;
    }

    /* 情報バー */
    #info-bar {
      position:fixed; top:16px; left:16px; z-index:50;
      background:rgba(0,0,0,.60);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; padding:12px 18px; border-radius:16px;
      font-family:-apple-system,'Helvetica Neue',sans-serif;
      pointer-events:none; line-height:1.75;
    }
    #info-bar .main { font-size:17px; font-weight:600; }
    #info-bar .sub  { font-size:12px; color:rgba(255,255,255,.5); }

    /* ボタン共通 */
    .fab {
      position:fixed; z-index:50;
      background:rgba(0,0,0,.60);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; border:none; border-radius:50%;
      width:52px; height:52px; font-size:22px;
      cursor:pointer; display:flex;
      align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    #settings-btn { top:16px; right:16px; }
    #reset-btn    { bottom:96px; right:16px; }

    /* ヒントバー */
    #hint {
      position:fixed; bottom:24px; left:50%;
      transform:translateX(-50%); z-index:50;
      background:rgba(0,0,0,.50);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      color:rgba(255,255,255,.85);
      padding:9px 22px; border-radius:20px;
      font-family:-apple-system,sans-serif; font-size:13px;
      pointer-events:none; white-space:nowrap;
      transition:opacity 1s ease;
    }
    #hint.fade { opacity:0; }

    /* カメラなしメッセージ */
    #no-cam {
      display:none;
      position:fixed; bottom:72px; left:50%;
      transform:translateX(-50%); z-index:50;
      background:rgba(180,60,0,.7);
      color:#fff; padding:8px 20px; border-radius:14px;
      font-family:-apple-system,sans-serif; font-size:13px;
      pointer-events:none; text-align:center; white-space:nowrap;
    }

    /* 設定パネル */
    #panel {
      position:fixed; top:0; right:-340px; width:320px; height:100%;
      background:rgba(14,14,18,.97);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      z-index:200; overflow-y:auto; -webkit-overflow-scrolling:touch;
      transition:right .3s cubic-bezier(.4,0,.2,1);
    }
    #panel.open { right:0; }

    .ph {
      display:flex; align-items:center; justify-content:space-between;
      padding:52px 20px 16px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .ph h2 {
      font-family:-apple-system,sans-serif;
      font-size:20px; font-weight:700; color:#fff;
    }
    .x-btn {
      background:rgba(255,255,255,.1); border:none; color:#fff;
      width:34px; height:34px; border-radius:50%; font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .pb { padding:22px 20px; }
    .sg { margin-bottom:20px; }
    .sg > label {
      display:block;
      font-family:-apple-system,sans-serif;
      font-size:11px; letter-spacing:1px;
      color:rgba(255,255,255,.4); text-transform:uppercase; margin-bottom:8px;
    }
    .row {
      display:flex; align-items:stretch;
      background:rgba(255,255,255,.08); border-radius:12px; overflow:hidden;
      border:1px solid rgba(255,255,255,.05);
    }
    .row input {
      flex:1; padding:13px 14px; background:none; border:none;
      color:#fff; font-size:24px; font-weight:300;
      font-family:-apple-system,sans-serif; outline:none; -webkit-appearance:none;
    }
    .row .u {
      display:flex; align-items:center; padding:0 14px 0 2px;
      color:rgba(255,255,255,.3); font-family:-apple-system,sans-serif; font-size:15px;
    }
    #apply {
      width:100%; padding:16px; background:#0A84FF;
      color:#fff; border:none; border-radius:14px;
      font-family:-apple-system,sans-serif; font-size:17px; font-weight:700;
      cursor:pointer; margin-top:6px; -webkit-tap-highlight-color:transparent;
    }
    #apply:active { background:#0060C7; }
    .div { height:1px; background:rgba(255,255,255,.07); margin:22px 0; }
    .note {
      font-family:-apple-system,sans-serif;
      font-size:13px; color:rgba(255,255,255,.3); line-height:2.0;
    }
    .note strong { color:rgba(255,255,255,.5); font-weight:500; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="touch-layer"></div>

<div id="info-bar">
  <div class="main">外径 <span id="v-outer">50</span> mm ／ 内径 <span id="v-inner">40</span> mm</div>
  <div class="sub">肉厚 <span id="v-wall">5.0</span> mm　長さ <span id="v-len">300</span> mm</div>
</div>

<button class="fab" id="settings-btn">⚙</button>
<button class="fab" id="reset-btn">↺</button>

<div id="hint">1本指：移動　ピンチ：拡大縮小　2本指ひねり：回転</div>
<div id="no-cam">カメラを起動できませんでした（背景は黒になります）</div>

<!-- 設定パネル -->
<div id="panel">
  <div class="ph">
    <h2>配管設定</h2>
    <button class="x-btn" id="close-panel">✕</button>
  </div>
  <div class="pb">
    <div class="sg">
      <label>外径（outer diameter）</label>
      <div class="row"><input type="number" id="in-outer" value="50" min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>内径（inner diameter）</label>
      <div class="row"><input type="number" id="in-inner" value="40" min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>長さ（length）</label>
      <div class="row"><input type="number" id="in-len" value="300" min="10" max="10000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <button id="apply">適　用</button>

    <div class="div"></div>
    <div class="note">
      <strong>操作方法</strong><br>
      　1本指ドラッグ … 配管を移動<br>
      　ピンチイン/アウト … 拡大縮小<br>
      　2本指ひねり … 回転<br>
      　↺ボタン … 初期位置に戻す
    </div>
    <div class="div"></div>
    <div class="note">
      <strong>実寸合わせのコツ</strong><br>
      　定規や名刺など大きさのわかる<br>
      　物と比べながらピンチで調整<br>
      　してください。
    </div>
    <div class="div"></div>
    <div class="note" style="color:rgba(255,255,255,.2)">
      ※ このアプリはカメラ映像の上に<br>
      　配管を重ねて表示します。<br>
      　カメラ使用の許可が必要です。
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ─────────────────────────────────────────────────────────
//  カメラ起動
// ─────────────────────────────────────────────────────────
(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    document.getElementById('no-cam').style.display = 'block';
  }
})();

// ─────────────────────────────────────────────────────────
//  Three.js セットアップ
//  1 Three.js unit = 1 mm
//  カメラを z=600mm に置き、FOV 45° → 腕を伸ばした距離で概ね実寸
// ─────────────────────────────────────────────────────────
const CAM_Z = 600; // mm
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 50000);
camera.position.set(0, 0, CAM_Z);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(3, 5, 4);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-2, -1, 3);
scene.add(fill);

// ─────────────────────────────────────────────────────────
//  配管モデル生成
// ─────────────────────────────────────────────────────────
let pipeGroup = null;
let pipeScale = 1;

function buildPipe(outerMM, innerMM, lenMM) {
  if (pipeGroup) {
    scene.remove(pipeGroup);
    pipeGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => m.dispose());
    });
  }

  const oR  = outerMM / 2;
  const iR  = innerMM / 2;
  const len = lenMM;
  const SEG = 72;

  const mGrayF = new THREE.MeshPhongMaterial({ color:0x909090, shininess:110, side:THREE.FrontSide });
  const mGrayD = new THREE.MeshPhongMaterial({ color:0x909090, shininess:110, side:THREE.DoubleSide });
  const mBlue  = new THREE.MeshPhongMaterial({ color:0x7EC8E3, shininess:70,  side:THREE.DoubleSide });

  const g = new THREE.Group();

  // 外側円筒面（灰色）
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(oR, oR, len, SEG, 1, true), mGrayF));

  // 内側円筒面（水色・両面で内部から見える）
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(iR, iR, len, SEG, 1, true), mBlue));

  // 両端の断面（肉厚リング + 水色の水路円）
  for (const s of [-1, 1]) {
    const y = s * len / 2;

    const ring = new THREE.Mesh(new THREE.RingGeometry(iR, oR, SEG), mGrayD.clone());
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = y;
    g.add(ring);

    const disk = new THREE.Mesh(new THREE.CircleGeometry(iR, SEG), mBlue.clone());
    disk.rotation.x = -Math.PI / 2;
    disk.position.y = y;
    g.add(disk);
  }

  // 初期の傾き（断面と側面が両方見える角度）
  g.rotation.x = 0.38;
  g.rotation.y = 0.48;

  scene.add(g);
  pipeGroup = g;
}

// ─────────────────────────────────────────────────────────
//  レンダーループ
// ─────────────────────────────────────────────────────────
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────────────────────────────────────────────────────
//  スクリーンピクセル → ワールド座標 (mm) 換算
// ─────────────────────────────────────────────────────────
function px2mm() {
  // z=0 面での可視高さ = 2 * CAM_Z * tan(FOV/2)
  return 2 * CAM_Z * Math.tan(camera.fov * Math.PI / 360) / innerHeight;
}

// ─────────────────────────────────────────────────────────
//  タッチ・マウス操作
// ─────────────────────────────────────────────────────────
const layer = document.getElementById('touch-layer');

let panning = false;
let panStart  = {x:0, y:0};
let pipeStart = {x:0, y:0};
let pinchDist0  = 0, pinchScale0 = 1;
let twistAngle0 = 0, twistRotZ0  = 0;

const tdist  = (a,b) => Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
const tangle = (a,b) => Math.atan2(b.clientY-a.clientY, b.clientX-a.clientX);

layer.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!pipeGroup) return;
  if (e.touches.length === 1) {
    panning = true;
    panStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    pipeStart = { x: pipeGroup.position.x, y: pipeGroup.position.y };
  } else if (e.touches.length >= 2) {
    panning = false;
    pinchDist0   = tdist(e.touches[0], e.touches[1]);
    pinchScale0  = pipeScale;
    twistAngle0  = tangle(e.touches[0], e.touches[1]);
    twistRotZ0   = pipeGroup.rotation.z;
  }
}, {passive:false});

layer.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!pipeGroup) return;
  if (e.touches.length === 1 && panning) {
    const s = px2mm();
    pipeGroup.position.x = pipeStart.x + (e.touches[0].clientX - panStart.x) * s;
    pipeGroup.position.y = pipeStart.y - (e.touches[0].clientY - panStart.y) * s;
  } else if (e.touches.length >= 2) {
    const dist  = tdist(e.touches[0], e.touches[1]);
    const angle = tangle(e.touches[0], e.touches[1]);
    pipeScale = Math.max(0.05, Math.min(30, pinchScale0 * dist / pinchDist0));
    pipeGroup.scale.setScalar(pipeScale);
    pipeGroup.rotation.z = twistRotZ0 + (angle - twistAngle0);
  }
}, {passive:false});

layer.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length < 1) panning = false;
}, {passive:false});

// マウス（PC 確認用）
layer.addEventListener('mousedown', e => {
  panning = true;
  panStart  = {x: e.clientX, y: e.clientY};
  if (pipeGroup) pipeStart = {x: pipeGroup.position.x, y: pipeGroup.position.y};
});
layer.addEventListener('mousemove', e => {
  if (!panning || !pipeGroup) return;
  const s = px2mm();
  pipeGroup.position.x = pipeStart.x + (e.clientX - panStart.x) * s;
  pipeGroup.position.y = pipeStart.y - (e.clientY - panStart.y) * s;
});
layer.addEventListener('mouseup',    () => panning = false);
layer.addEventListener('mouseleave', () => panning = false);
layer.addEventListener('wheel', e => {
  e.preventDefault();
  if (!pipeGroup) return;
  pipeScale = Math.max(0.05, Math.min(30, pipeScale * (e.deltaY > 0 ? 0.88 : 1.14)));
  pipeGroup.scale.setScalar(pipeScale);
}, {passive:false});

// ─────────────────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────────────────
function updateInfo(outer, inner, len) {
  document.getElementById('v-outer').textContent = outer;
  document.getElementById('v-inner').textContent = inner;
  document.getElementById('v-wall').textContent  = ((outer - inner) / 2).toFixed(1);
  document.getElementById('v-len').textContent   = len;
}

document.getElementById('settings-btn').onclick = () => document.getElementById('panel').classList.add('open');
document.getElementById('close-panel').onclick  = () => document.getElementById('panel').classList.remove('open');

document.getElementById('apply').addEventListener('click', () => {
  const outer = parseFloat(document.getElementById('in-outer').value) || 0;
  const inner = parseFloat(document.getElementById('in-inner').value) || 0;
  const len   = parseFloat(document.getElementById('in-len').value)   || 0;
  if (outer <= 0 || inner <= 0 || len <= 0) { alert('正の数を入力してください。'); return; }
  if (inner >= outer)                        { alert('内径は外径より小さい値にしてください。'); return; }

  // 位置・向き・スケールを引き継ぐ
  const pos  = pipeGroup ? pipeGroup.position.clone() : new THREE.Vector3();
  const rotZ = pipeGroup ? pipeGroup.rotation.z : 0;

  buildPipe(outer, inner, len);
  pipeGroup.position.copy(pos);
  pipeGroup.rotation.z = rotZ;
  pipeGroup.scale.setScalar(pipeScale);

  updateInfo(outer, inner, len);
  document.getElementById('panel').classList.remove('open');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!pipeGroup) return;
  pipeGroup.position.set(0, 0, 0);
  pipeGroup.rotation.set(0.38, 0.48, 0);
  pipeScale = 1;
  pipeGroup.scale.setScalar(1);
});

// ヒントは 5 秒でフェードアウト
setTimeout(() => document.getElementById('hint').classList.add('fade'), 5000);

// ─────────────────────────────────────────────────────────
//  初期化
// ─────────────────────────────────────────────────────────
buildPipe(50, 40, 300);
updateInfo(50, 40, 300);
</script>
</body>
</html>
