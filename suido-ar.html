<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水道配管 AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; background:#111; overflow:hidden; }

    model-viewer {
      width:100%; height:100vh;
      --poster-color:#111;
      background: radial-gradient(ellipse at center, #1e2a38 0%, #0d1117 100%);
    }

    /* AR ボタン（対応デバイスのみ表示） */
    #ar-btn {
      position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
      background:linear-gradient(135deg,#0A84FF,#005FCC);
      color:#fff; border:none; border-radius:30px;
      padding:16px 38px;
      font-family:-apple-system,'Helvetica Neue',sans-serif;
      font-size:17px; font-weight:700;
      cursor:pointer; white-space:nowrap;
      box-shadow:0 6px 28px rgba(10,132,255,.55);
      -webkit-tap-highlight-color:transparent;
    }

    /* 情報バー */
    #info-bar {
      position:fixed; top:16px; left:16px; z-index:60;
      background:rgba(0,0,0,.60);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; padding:12px 18px; border-radius:16px;
      font-family:-apple-system,sans-serif; pointer-events:none; line-height:1.75;
    }
    #info-bar .main { font-size:17px; font-weight:600; }
    #info-bar .sub  { font-size:12px; color:rgba(255,255,255,.5); }

    /* 設定ボタン */
    #settings-btn {
      position:fixed; top:16px; right:16px; z-index:60;
      background:rgba(0,0,0,.60);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; border:none; border-radius:50%;
      width:52px; height:52px; font-size:22px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }

    /* ローディング */
    #loading {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:80; color:rgba(255,255,255,.65);
      font-family:-apple-system,sans-serif; font-size:15px; text-align:center;
    }
    .spin {
      width:36px; height:36px; margin:0 auto 14px;
      border:3px solid rgba(255,255,255,.15);
      border-top-color:rgba(255,255,255,.7);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* エラー */
    #err {
      display:none;
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:90; max-width:320px; width:90%;
      background:rgba(20,10,10,.95); border:1px solid rgba(255,80,80,.3);
      border-radius:16px; padding:28px 24px; text-align:center;
      font-family:-apple-system,sans-serif; color:#fff;
    }
    #err p { font-size:14px; color:rgba(255,200,200,.85); line-height:1.7; margin-top:10px; word-break:break-all; }
    #err button { margin-top:16px; padding:10px 28px; background:#0A84FF; color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; }

    /* 設定パネル */
    #panel {
      position:fixed; top:0; right:-340px; width:320px; height:100%;
      background:rgba(14,14,18,.97);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      z-index:200; overflow-y:auto; -webkit-overflow-scrolling:touch;
      transition:right .3s cubic-bezier(.4,0,.2,1);
    }
    #panel.open { right:0; }
    .ph {
      display:flex; align-items:center; justify-content:space-between;
      padding:52px 20px 16px; border-bottom:1px solid rgba(255,255,255,.07);
    }
    .ph h2 { font-family:-apple-system,sans-serif; font-size:20px; font-weight:700; color:#fff; }
    .xbtn {
      background:rgba(255,255,255,.1); border:none; color:#fff;
      width:34px; height:34px; border-radius:50%; font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .pb { padding:22px 20px; }
    .sg { margin-bottom:20px; }
    .sg>label {
      display:block; font-family:-apple-system,sans-serif;
      font-size:11px; letter-spacing:1px; color:rgba(255,255,255,.4);
      text-transform:uppercase; margin-bottom:8px;
    }
    .ir {
      display:flex; align-items:stretch;
      background:rgba(255,255,255,.08); border-radius:12px; overflow:hidden;
      border:1px solid rgba(255,255,255,.05);
    }
    .ir input {
      flex:1; padding:13px 14px; background:none; border:none;
      color:#fff; font-size:24px; font-weight:300;
      font-family:-apple-system,sans-serif; outline:none; -webkit-appearance:none;
    }
    .ir .u {
      display:flex; align-items:center; padding:0 14px 0 2px;
      color:rgba(255,255,255,.3); font-family:-apple-system,sans-serif; font-size:15px;
    }
    #apply {
      width:100%; padding:16px; background:#0A84FF; color:#fff; border:none;
      border-radius:14px; font-family:-apple-system,sans-serif;
      font-size:17px; font-weight:700; cursor:pointer; margin-top:6px;
      -webkit-tap-highlight-color:transparent;
    }
    #apply:active { background:#0060C7; }
    .dv { height:1px; background:rgba(255,255,255,.07); margin:22px 0; }
    .nt { font-family:-apple-system,sans-serif; font-size:13px; color:rgba(255,255,255,.3); line-height:2.0; }
    .nt strong { color:rgba(255,255,255,.5); font-weight:500; }
  </style>
</head>
<body>

<model-viewer id="viewer"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="fixed"
  ar-placement="floor"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  auto-rotate-delay="3000"
  rotation-per-second="20deg"
  shadow-intensity="1"
  shadow-softness="0.7"
  environment-image="neutral"
  exposure="1.1"
  camera-orbit="35deg 72deg auto"
>
  <button slot="ar-button" id="ar-btn">📐 ARで実寸確認</button>
</model-viewer>

<div id="info-bar">
  <div class="main">外径 <span id="v-o">50</span> mm ／ 内径 <span id="v-i">40</span> mm</div>
  <div class="sub">肉厚 <span id="v-w">5.0</span> mm　長さ <span id="v-l">300</span> mm</div>
</div>

<button id="settings-btn">⚙</button>

<div id="loading"><div class="spin"></div>配管モデルを生成中...</div>
<div id="err"><span style="font-size:32px">⚠️</span><p id="err-msg"></p><button onclick="location.reload()">再読み込み</button></div>

<!-- 設定パネル -->
<div id="panel">
  <div class="ph">
    <h2>配管設定</h2>
    <button class="xbtn" id="close-panel">✕</button>
  </div>
  <div class="pb">
    <div class="sg">
      <label>外径（outer diameter）</label>
      <div class="ir"><input type="number" id="in-o" value="50"  min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>内径（inner diameter）</label>
      <div class="ir"><input type="number" id="in-i" value="40"  min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>長さ（length）</label>
      <div class="ir"><input type="number" id="in-l" value="300" min="10" max="10000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <button id="apply">適　用</button>

    <div class="dv"></div>
    <div class="nt">
      <strong>AR の使い方（iPhone / iPad）</strong><br>
      ① 「ARで実寸確認」をタップ<br>
      ② カメラを床や地面に向ける<br>
      ③ 白い輪が出たらタップして配置<br>
      ④ 実際の大きさで表示されます<br>
      ⑤ 配管を動かしたり回したりできます
    </div>
    <div class="dv"></div>
    <div class="nt">
      <strong>3D プレビュー操作</strong><br>
      　1本指ドラッグ … 回転<br>
      　ピンチ … 拡大縮小
    </div>
    <div class="dv"></div>
    <div class="nt" style="color:rgba(255,255,255,.2)">
      ※ AR は iOS 12 以降の Safari、<br>
      　または Android Chrome で使用できます。<br>
      　HTTPS 接続が必要です。
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ── エラー表示 ──────────────────────────────────────────────────────
function showErr(msg) {
  console.error(msg);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').style.display = 'block';
}
window.addEventListener('unhandledrejection', e =>
  showErr('エラー: ' + (e.reason?.message ?? String(e.reason)))
);

// ── Service Worker 登録 ────────────────────────────────────────────
async function setupSW() {
  if (!('serviceWorker' in navigator)) return false;
  try {
    await navigator.serviceWorker.register('./sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    // SW が現在のページを制御するまで待つ
    if (!navigator.serviceWorker.controller) {
      await new Promise(r => navigator.serviceWorker.addEventListener('controllerchange', r, {once:true}));
    }
    return true;
  } catch(e) {
    console.warn('Service Worker 登録失敗:', e);
    return false;
  }
}

// ── 配管ジオメトリ生成（単位 = m、model-viewer AR は 1unit=1m） ──
function buildPipe(outerMM, innerMM, lenMM) {
  const oR  = outerMM / 2 / 1000;
  const iR  = innerMM / 2 / 1000;
  const len = lenMM       / 1000;
  const SEG = 72;
  const g   = new THREE.Group();

  const mGF = new THREE.MeshStandardMaterial({ color:0x909090, metalness:0.35, roughness:0.50, side:THREE.FrontSide });
  const mGD = new THREE.MeshStandardMaterial({ color:0x909090, metalness:0.35, roughness:0.50, side:THREE.DoubleSide });
  const mBD = new THREE.MeshStandardMaterial({ color:0x7EC8E3, metalness:0.05, roughness:0.55, side:THREE.DoubleSide });

  g.add(new THREE.Mesh(new THREE.CylinderGeometry(oR,oR,len,SEG,1,true), mGF));
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(iR,iR,len,SEG,1,true), mBD));

  for (const s of [-1,1]) {
    const y = s*len/2;
    const ring = new THREE.Mesh(new THREE.RingGeometry(iR,oR,SEG), mGD.clone());
    ring.rotation.x = -Math.PI/2; ring.position.y = y; g.add(ring);
    const disk = new THREE.Mesh(new THREE.CircleGeometry(iR,SEG), mBD.clone());
    disk.rotation.x = -Math.PI/2; disk.position.y = y; g.add(disk);
  }

  // 水平配置（X 軸方向）＋床面に接するよう Y オフセット
  g.rotation.z = Math.PI / 2;
  g.position.y = oR;
  return g;
}

// ── GLB エクスポート ───────────────────────────────────────────────
function exportGLB(group) {
  return new Promise((resolve, reject) => {
    new GLTFExporter().parse(
      group,
      buf => resolve(buf),
      err => reject(new Error('GLTFExporter: ' + (err?.message ?? err))),
      { binary: true }
    );
  });
}

// ── モデル更新（SW 経由で model-viewer に渡す） ────────────────────
let swAvailable = false;
let prevBlobUrl = null;
let version = 0;

async function updateModel(outer, inner, length) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('err').style.display = 'none';

  try {
    await customElements.whenDefined('model-viewer');
    const viewer = document.getElementById('viewer');

    const group = buildPipe(outer, inner, length);
    const glb   = await exportGLB(group);

    group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => m.dispose());
    });

    if (swAvailable && navigator.serviceWorker.controller) {
      // Service Worker 経由 → iOS AR Quick Look が使える
      navigator.serviceWorker.controller.postMessage(
        { type: 'SET_GLB', buffer: glb.slice(0) }
      );
      // SW にデータが届くのを少し待ってから src を更新
      await new Promise(r => setTimeout(r, 150));
      version++;
      await new Promise((resolve, reject) => {
        const onLoad  = () => { viewer.removeEventListener('error', onErr); resolve(); };
        const onErr   = () => { viewer.removeEventListener('load',  onLoad); reject(new Error('モデル読み込みエラー')); };
        viewer.addEventListener('load',  onLoad, {once:true});
        viewer.addEventListener('error', onErr,  {once:true});
        viewer.src = `./pipe.glb?v=${version}`;
      });
    } else {
      // SW 非対応フォールバック（Blob URL → AR 非対応になるが 3D プレビューは動く）
      const blob = new Blob([glb], { type:'model/gltf-binary' });
      const url  = URL.createObjectURL(blob);
      if (prevBlobUrl) URL.revokeObjectURL(prevBlobUrl);
      prevBlobUrl = url;
      await new Promise((resolve, reject) => {
        const onLoad = () => { viewer.removeEventListener('error', onErr); resolve(); };
        const onErr  = () => { viewer.removeEventListener('load', onLoad); reject(new Error('モデル読み込みエラー')); };
        viewer.addEventListener('load',  onLoad, {once:true});
        viewer.addEventListener('error', onErr,  {once:true});
        viewer.src = url;
      });
    }

  } catch(e) {
    showErr(e.message || String(e));
    return;
  }

  document.getElementById('loading').style.display = 'none';

  // AR 可否を情報バーに反映
  const viewer = document.getElementById('viewer');
  if (!viewer.canActivateAR) {
    console.log('AR 非対応（3D プレビューのみ）');
  }
}

// ── 情報バー更新 ────────────────────────────────────────────────────
function updateInfo(o, i, l) {
  document.getElementById('v-o').textContent = o;
  document.getElementById('v-i').textContent = i;
  document.getElementById('v-w').textContent = ((o-i)/2).toFixed(1);
  document.getElementById('v-l').textContent = l;
}

// ── UI イベント ─────────────────────────────────────────────────────
document.getElementById('settings-btn').onclick = () => document.getElementById('panel').classList.add('open');
document.getElementById('close-panel').onclick  = () => document.getElementById('panel').classList.remove('open');

document.getElementById('apply').addEventListener('click', async () => {
  const o = parseFloat(document.getElementById('in-o').value) || 0;
  const i = parseFloat(document.getElementById('in-i').value) || 0;
  const l = parseFloat(document.getElementById('in-l').value) || 0;
  if (o<=0||i<=0||l<=0)  { alert('正の数を入力してください。'); return; }
  if (i >= o)             { alert('内径は外径より小さい値にしてください。'); return; }
  document.getElementById('panel').classList.remove('open');
  updateInfo(o, i, l);
  await updateModel(o, i, l);
});

// ── 初期化 ──────────────────────────────────────────────────────────
swAvailable = await setupSW();
updateInfo(50, 40, 300);
await updateModel(50, 40, 300);
</script>
</body>
</html>
