<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>水道配管 AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- model-viewer は AR 起動専用（画面外に隠す） -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; }

    /* ── カメラ映像 ── */
    #video {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0;
    }
    /* ── Three.js 配管オーバーレイ ── */
    #canvas {
      position:fixed; inset:0; width:100%; height:100%;
      z-index:1; pointer-events:none;
    }
    /* ── タッチ操作レイヤー ── */
    #touch-layer {
      position:fixed; inset:0; z-index:10; touch-action:none;
    }

    /* ── 情報バー ── */
    #info-bar {
      position:fixed; top:16px; left:16px; z-index:50;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; padding:12px 18px; border-radius:16px;
      font-family:-apple-system,sans-serif; pointer-events:none; line-height:1.75;
    }
    #info-bar .main { font-size:17px; font-weight:600; }
    #info-bar .sub  { font-size:12px; color:rgba(255,255,255,.5); }

    /* ── FAB ボタン共通 ── */
    .fab {
      position:fixed; z-index:50;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      color:#fff; border:none; border-radius:50%;
      width:52px; height:52px; font-size:22px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    #settings-btn { top:16px; right:16px; }
    #reset-btn    { bottom:calc(104px + env(safe-area-inset-bottom)); right:16px; }

    /* ── AR 起動ボタン ── */
    #ar-btn {
      display:none; /* canActivateAR が true になったら表示 */
      position:fixed;
      bottom:calc(28px + env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      z-index:50;
      background:linear-gradient(135deg,#0A84FF,#005FCC);
      color:#fff; border:none; border-radius:30px;
      padding:16px 38px;
      font-family:-apple-system,sans-serif; font-size:17px; font-weight:700;
      cursor:pointer; white-space:nowrap;
      box-shadow:0 6px 28px rgba(10,132,255,.55);
      -webkit-tap-highlight-color:transparent;
    }

    /* AR 非対応時メッセージ */
    #no-ar-msg {
      display:none;
      position:fixed;
      bottom:calc(24px + env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      z-index:50;
      background:rgba(0,0,0,.5);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      color:rgba(255,255,255,.6); padding:10px 22px; border-radius:20px;
      font-family:-apple-system,sans-serif; font-size:13px;
      pointer-events:none; white-space:nowrap;
    }

    /* ── ヒント ── */
    #hint {
      position:fixed;
      bottom:calc(84px + env(safe-area-inset-bottom));
      left:50%; transform:translateX(-50%);
      z-index:50;
      background:rgba(0,0,0,.5);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      color:rgba(255,255,255,.85); padding:9px 22px; border-radius:20px;
      font-family:-apple-system,sans-serif; font-size:13px;
      pointer-events:none; white-space:nowrap;
      transition:opacity 1s ease;
    }
    #hint.fade { opacity:0; }

    /* AR ボタンが準備中のときは半透明 */
    #ar-btn[style*="0.4"] { cursor:wait; }

    /* ── 設定パネル ── */
    #panel {
      position:fixed; top:0; right:-340px; width:320px; height:100%;
      background:rgba(14,14,18,.97);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      z-index:200; overflow-y:auto; -webkit-overflow-scrolling:touch;
      transition:right .3s cubic-bezier(.4,0,.2,1);
    }
    #panel.open { right:0; }
    .ph {
      display:flex; align-items:center; justify-content:space-between;
      padding:52px 20px 16px; border-bottom:1px solid rgba(255,255,255,.07);
    }
    .ph h2 { font-family:-apple-system,sans-serif; font-size:20px; font-weight:700; color:#fff; }
    .xbtn {
      background:rgba(255,255,255,.1); border:none; color:#fff;
      width:34px; height:34px; border-radius:50%; font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .pb { padding:22px 20px; }
    .sg { margin-bottom:20px; }
    .sg>label {
      display:block; font-family:-apple-system,sans-serif;
      font-size:11px; letter-spacing:1px; color:rgba(255,255,255,.4);
      text-transform:uppercase; margin-bottom:8px;
    }
    .ir {
      display:flex; align-items:stretch;
      background:rgba(255,255,255,.08); border-radius:12px; overflow:hidden;
      border:1px solid rgba(255,255,255,.05);
    }
    .ir input {
      flex:1; padding:13px 14px; background:none; border:none;
      color:#fff; font-size:24px; font-weight:300;
      font-family:-apple-system,sans-serif; outline:none; -webkit-appearance:none;
    }
    .ir .u {
      display:flex; align-items:center; padding:0 14px 0 2px;
      color:rgba(255,255,255,.3); font-family:-apple-system,sans-serif; font-size:15px;
    }
    #apply {
      width:100%; padding:16px; background:#0A84FF; color:#fff; border:none;
      border-radius:14px; font-family:-apple-system,sans-serif;
      font-size:17px; font-weight:700; cursor:pointer; margin-top:6px;
      -webkit-tap-highlight-color:transparent;
    }
    #apply:active { background:#0060C7; }
    .dv { height:1px; background:rgba(255,255,255,.07); margin:22px 0; }
    .nt { font-family:-apple-system,sans-serif; font-size:13px; color:rgba(255,255,255,.3); line-height:2.0; }
    .nt strong { color:rgba(255,255,255,.5); font-weight:500; }

    /* ── AR 専用 model-viewer（ほぼ不可視だが描画される） ── */
    #ar-mv {
      position:fixed; bottom:0; right:0;
      width:2px; height:2px; overflow:hidden;
      opacity:0.01; pointer-events:none; z-index:-1;
    }
  </style>
</head>
<body>

<!-- カメラ映像 -->
<video id="video" autoplay playsinline muted></video>
<!-- Three.js 配管 -->
<canvas id="canvas"></canvas>
<!-- タッチ操作 -->
<div id="touch-layer"></div>

<!-- UI -->
<div id="info-bar">
  <div class="main">外径 <span id="v-o">50</span> mm ／ 内径 <span id="v-i">40</span> mm</div>
  <div class="sub">肉厚 <span id="v-w">5.0</span> mm　長さ <span id="v-l">300</span> mm</div>
</div>

<button class="fab" id="settings-btn">⚙</button>
<button class="fab" id="reset-btn">↺</button>
<div id="hint">1本指：移動　ピンチ：拡大縮小　2本指ひねり：回転</div>
<button id="ar-btn">📐 ARで実寸配置</button>
<div id="no-ar-msg">3Dプレビューモード（AR は Safari / Android Chrome で対応）</div>

<!-- AR 専用の model-viewer（ほぼ不可視） -->
<model-viewer id="ar-mv"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="fixed"
  ar-placement="floor"
></model-viewer>

<!-- 設定パネル -->
<div id="panel">
  <div class="ph">
    <h2>配管設定</h2>
    <button class="xbtn" id="close-panel">✕</button>
  </div>
  <div class="pb">
    <div class="sg">
      <label>外径（outer diameter）</label>
      <div class="ir"><input type="number" id="in-o" value="50"  min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>内径（inner diameter）</label>
      <div class="ir"><input type="number" id="in-i" value="40"  min="1" max="5000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <div class="sg">
      <label>長さ（length）</label>
      <div class="ir"><input type="number" id="in-l" value="300" min="10" max="10000" inputmode="decimal"><span class="u">mm</span></div>
    </div>
    <button id="apply">適　用</button>
    <div class="dv"></div>
    <div class="nt">
      <strong>AR の使い方（iOS / Android）</strong><br>
      ①「ARで実寸配置」をタップ<br>
      ② カメラを床や地面に向ける<br>
      ③ 白い輪が出たらタップして配置<br>
      ④ 実際の大きさで配管が現れます
    </div>
    <div class="dv"></div>
    <div class="nt">
      <strong>3Dプレビュー操作</strong><br>
      　1本指ドラッグ … 移動<br>
      　ピンチ … 拡大縮小<br>
      　2本指ひねり … 回転<br>
      　↺ … 初期位置に戻す
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ═══════════════════════════════════════════════════════════
//  カメラ（背景映像）
// ═══════════════════════════════════════════════════════════
(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
  } catch (_) { /* カメラ不可でも動作継続（背景が黒になるだけ） */ }
})();

// ═══════════════════════════════════════════════════════════
//  Three.js — 配管プレビュー（単位 = m ）
//  CAM_Z = 0.6m（腕を伸ばした距離）で実寸感に近い表示
// ═══════════════════════════════════════════════════════════
const CAM_Z = 0.6;
const canvas  = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 1000);
camera.position.set(0, 0, CAM_Z);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun  = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(1, 2, 2); scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.3); fill.position.set(-1,-1,1); scene.add(fill);

renderer.setAnimationLoop(() => renderer.render(scene, camera));

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══════════════════════════════════════════════════════════
//  配管ジオメトリ（単位 = m）
// ═══════════════════════════════════════════════════════════
let pipeGroup = null;
let pipeScale = 1;

function buildPipe(outerMM, innerMM, lenMM) {
  if (pipeGroup) {
    scene.remove(pipeGroup);
    pipeGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => m.dispose());
    });
  }

  const oR  = outerMM / 2 / 1000;
  const iR  = innerMM / 2 / 1000;
  const len = lenMM       / 1000;
  const SEG = 72;
  const g   = new THREE.Group();

  const mGF = new THREE.MeshPhongMaterial({ color:0x909090, shininess:110, side:THREE.FrontSide });
  const mGD = new THREE.MeshPhongMaterial({ color:0x909090, shininess:110, side:THREE.DoubleSide });
  const mBD = new THREE.MeshPhongMaterial({ color:0x7EC8E3, shininess:80,  side:THREE.DoubleSide });

  g.add(new THREE.Mesh(new THREE.CylinderGeometry(oR,oR,len,SEG,1,true), mGF));
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(iR,iR,len,SEG,1,true), mBD));

  for (const s of [-1, 1]) {
    const y = s * len / 2;
    const ring = new THREE.Mesh(new THREE.RingGeometry(iR,oR,SEG), mGD.clone());
    ring.rotation.x = -Math.PI/2; ring.position.y = y; g.add(ring);
    const disk = new THREE.Mesh(new THREE.CircleGeometry(iR,SEG), mBD.clone());
    disk.rotation.x = -Math.PI/2; disk.position.y = y; g.add(disk);
  }

  g.rotation.set(0.38, 0.48, 0);
  scene.add(g);
  pipeGroup = g;
  pipeGroup.scale.setScalar(pipeScale);
}

// ═══════════════════════════════════════════════════════════
//  GLB エクスポート（AR 用）
// ═══════════════════════════════════════════════════════════
function exportGLB(group) {
  return new Promise((resolve, reject) => {
    new GLTFExporter().parse(
      group,
      buf => resolve(buf),
      err => reject(new Error('GLTFExporter: ' + (err?.message ?? err))),
      { binary: true }
    );
  });
}

// AR 用パイプ（水平置き・床接地 y=0 で、プレビューの傾きなし）
function buildARPipe(outerMM, innerMM, lenMM) {
  const oR  = outerMM / 2 / 1000;
  const iR  = innerMM / 2 / 1000;
  const len = lenMM       / 1000;
  const SEG = 72;
  const g   = new THREE.Group();

  const mGF = new THREE.MeshStandardMaterial({ color:0x909090, metalness:0.35, roughness:0.5, side:THREE.FrontSide });
  const mGD = new THREE.MeshStandardMaterial({ color:0x909090, metalness:0.35, roughness:0.5, side:THREE.DoubleSide });
  const mBD = new THREE.MeshStandardMaterial({ color:0x7EC8E3, metalness:0.05, roughness:0.55, side:THREE.DoubleSide });

  g.add(new THREE.Mesh(new THREE.CylinderGeometry(oR,oR,len,SEG,1,true), mGF));
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(iR,iR,len,SEG,1,true), mBD));

  for (const s of [-1, 1]) {
    const y = s * len / 2;
    const ring = new THREE.Mesh(new THREE.RingGeometry(iR,oR,SEG), mGD.clone());
    ring.rotation.x = -Math.PI/2; ring.position.y = y; g.add(ring);
    const disk = new THREE.Mesh(new THREE.CircleGeometry(iR,SEG), mBD.clone());
    disk.rotation.x = -Math.PI/2; disk.position.y = y; g.add(disk);
  }

  // 水平（X 軸方向）に寝かせ、底面を y=0 に
  g.rotation.z = Math.PI / 2;
  g.position.y = oR;
  return g;
}

// ═══════════════════════════════════════════════════════════
//  Service Worker 登録
// ═══════════════════════════════════════════════════════════
let swReady = false;

async function setupSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('./sw.js', { scope: './' });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(r =>
        navigator.serviceWorker.addEventListener('controllerchange', r, { once: true })
      );
    }
    swReady = true;
  } catch (e) {
    console.warn('SW 登録失敗:', e.message);
  }
}

// SW に GLB を送り、「受け取った」確認を待つ
function sendGLBtoSW(buffer) {
  return new Promise(resolve => {
    if (!swReady || !navigator.serviceWorker.controller) { resolve(false); return; }
    const onMsg = e => {
      if (e.data?.type === 'GLB_READY') {
        navigator.serviceWorker.removeEventListener('message', onMsg);
        resolve(true);
      }
    };
    navigator.serviceWorker.addEventListener('message', onMsg);
    navigator.serviceWorker.controller.postMessage(
      { type: 'SET_GLB', buffer: buffer.slice(0) }
    );
    // 3 秒でタイムアウト
    setTimeout(() => { navigator.serviceWorker.removeEventListener('message', onMsg); resolve(false); }, 3000);
  });
}

// ═══════════════════════════════════════════════════════════
//  model-viewer に GLB を読み込む（AR 用）
// ═══════════════════════════════════════════════════════════
let mvVersion = 0;
let prevBlobUrl = null;

async function loadARModel(outerMM, innerMM, lenMM) {
  const arGroup = buildARPipe(outerMM, innerMM, lenMM);
  const glb     = await exportGLB(arGroup);
  arGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
  });

  await customElements.whenDefined('model-viewer');
  const mv = document.getElementById('ar-mv');

  // SW が使えるなら実 URL で渡す（iOS AR Quick Look が確実に動く）
  // model-viewer に src をセットして load を待つ（最大8秒）
  function setAndWait(src) {
    return new Promise(resolve => {
      const done = () => {
        mv.removeEventListener('load',  onLoad);
        mv.removeEventListener('error', onErr);
        clearTimeout(timer);
        resolve();
      };
      const onLoad = done;
      const onErr  = done;
      const timer  = setTimeout(done, 8000); // タイムアウトでも続行
      mv.addEventListener('load',  onLoad, { once: true });
      mv.addEventListener('error', onErr,  { once: true });
      mv.src = src;
    });
  }

  const swOK = await sendGLBtoSW(glb);
  if (swOK) {
    mvVersion++;
    await setAndWait(`./pipe.glb?v=${mvVersion}`);
  } else {
    // フォールバック: blob URL
    const blob = new Blob([glb], { type: 'model/gltf-binary' });
    const url  = URL.createObjectURL(blob);
    if (prevBlobUrl) URL.revokeObjectURL(prevBlobUrl);
    prevBlobUrl = url;
    await setAndWait(url);
  }

  return mv.canActivateAR;
}

// ═══════════════════════════════════════════════════════════
//  タッチ操作（通常プレビュー用）
// ═══════════════════════════════════════════════════════════
const layer = document.getElementById('touch-layer');
let panning=false, panStart={x:0,y:0}, pipeStart={x:0,y:0};
let pinchDist0=0, pinchScale0=1, twistA0=0, twistZ0=0;
const tdist  = (a,b) => Math.hypot(b.clientX-a.clientX, b.clientY-a.clientY);
const tangle = (a,b) => Math.atan2(b.clientY-a.clientY, b.clientX-a.clientX);
function px2m() { return 2*CAM_Z*Math.tan(camera.fov*Math.PI/360)/innerHeight; }

layer.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!pipeGroup) return;
  if (e.touches.length === 1) {
    panning = true;
    panStart  = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    pipeStart = { x:pipeGroup.position.x,  y:pipeGroup.position.y };
  } else if (e.touches.length >= 2) {
    panning = false;
    pinchDist0  = tdist(e.touches[0], e.touches[1]);
    pinchScale0 = pipeScale;
    twistA0 = tangle(e.touches[0], e.touches[1]);
    twistZ0 = pipeGroup.rotation.z;
  }
}, { passive: false });

layer.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!pipeGroup) return;
  if (e.touches.length === 1 && panning) {
    const s = px2m();
    pipeGroup.position.x = pipeStart.x + (e.touches[0].clientX - panStart.x) * s;
    pipeGroup.position.y = pipeStart.y - (e.touches[0].clientY - panStart.y) * s;
  } else if (e.touches.length >= 2) {
    const dist  = tdist(e.touches[0], e.touches[1]);
    const angle = tangle(e.touches[0], e.touches[1]);
    pipeScale = Math.max(0.05, Math.min(30, pinchScale0 * dist / pinchDist0));
    pipeGroup.scale.setScalar(pipeScale);
    pipeGroup.rotation.z = twistZ0 + (angle - twistA0);
  }
}, { passive: false });
layer.addEventListener('touchend', e => { e.preventDefault(); if(e.touches.length<1) panning=false; }, { passive:false });

// マウス（PC 確認用）
layer.addEventListener('mousedown', e => {
  panning=true; panStart={x:e.clientX,y:e.clientY};
  if(pipeGroup) pipeStart={x:pipeGroup.position.x,y:pipeGroup.position.y};
});
layer.addEventListener('mousemove', e => {
  if(!panning||!pipeGroup) return;
  const s=px2m();
  pipeGroup.position.x=pipeStart.x+(e.clientX-panStart.x)*s;
  pipeGroup.position.y=pipeStart.y-(e.clientY-panStart.y)*s;
});
layer.addEventListener('mouseup',    ()=>panning=false);
layer.addEventListener('mouseleave', ()=>panning=false);
layer.addEventListener('wheel', e => {
  e.preventDefault();
  if(!pipeGroup) return;
  pipeScale=Math.max(0.05,Math.min(30,pipeScale*(e.deltaY>0?.88:1.14)));
  pipeGroup.scale.setScalar(pipeScale);
}, { passive:false });

// ═══════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════
function updateInfo(o, i, l) {
  document.getElementById('v-o').textContent = o;
  document.getElementById('v-i').textContent = i;
  document.getElementById('v-w').textContent = ((o-i)/2).toFixed(1);
  document.getElementById('v-l').textContent = l;
}

document.getElementById('settings-btn').onclick = () => document.getElementById('panel').classList.add('open');
document.getElementById('close-panel').onclick  = () => document.getElementById('panel').classList.remove('open');

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!pipeGroup) return;
  pipeGroup.position.set(0,0,0);
  pipeGroup.rotation.set(0.38,0.48,0);
  pipeScale=1; pipeGroup.scale.setScalar(1);
});

// AR ボタン
document.getElementById('ar-btn').addEventListener('click', async () => {
  const mv = document.getElementById('ar-mv');
  if (!mv.canActivateAR) {
    alert('AR を起動できません。Safari でお試しください。');
    return;
  }
  try {
    mv.activateAR();
  } catch(e) {
    alert('AR 起動エラー: ' + e.message);
  }
});

// 設定適用
document.getElementById('apply').addEventListener('click', () => {
  const o = parseFloat(document.getElementById('in-o').value) || 0;
  const i = parseFloat(document.getElementById('in-i').value) || 0;
  const l = parseFloat(document.getElementById('in-l').value) || 0;
  if (o<=0||i<=0||l<=0) { alert('正の数を入力してください。'); return; }
  if (i>=o)             { alert('内径は外径より小さい値にしてください。'); return; }

  document.getElementById('panel').classList.remove('open');

  // ① プレビューをすぐに更新（await しない）
  const pos  = pipeGroup ? pipeGroup.position.clone() : new THREE.Vector3();
  const rotZ = pipeGroup ? pipeGroup.rotation.z : 0;
  buildPipe(o, i, l);
  pipeGroup.position.copy(pos);
  pipeGroup.rotation.z = rotZ;
  pipeGroup.scale.setScalar(pipeScale);
  updateInfo(o, i, l);

  // ② AR モデルはバックグラウンドで更新（UIをブロックしない）
  refreshARModel(o, i, l);
});

async function refreshARModel(o, i, l) {
  const btn = document.getElementById('ar-btn');
  btn.style.opacity = '0.4';
  btn.style.pointerEvents = 'none';
  try {
    const canAR = await loadARModel(o, i, l);
    document.getElementById('ar-btn').style.display    = canAR ? 'block' : 'none';
    document.getElementById('no-ar-msg').style.display = canAR ? 'none'  : 'block';
  } catch(e) {
    console.warn('AR モデル更新失敗:', e.message);
  }
  btn.style.opacity = '1';
  btn.style.pointerEvents = 'auto';
}

setTimeout(() => document.getElementById('hint').classList.add('fade'), 5000);

// ═══════════════════════════════════════════════════════════
//  初期化
// ═══════════════════════════════════════════════════════════
buildPipe(50, 40, 300);
updateInfo(50, 40, 300);

// SW と AR モデルの準備（バックグラウンドで実行・UIをブロックしない）
setupSW().then(() => refreshARModel(50, 40, 300));
</script>
</body>
</html>
